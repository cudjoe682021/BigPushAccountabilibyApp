# Render Blueprint for the BigPush Accountability API + dashboard.
#
# This deploys the Express API (and the /dashboard static files it serves)
# to Render's free web service tier. It does NOT provision a database here
# on purpose — Render's own free Postgres expires 30 days after creation
# and is deleted 14 days after that. Use a free Neon Postgres database
# instead (its free tier does not expire) and paste its connection string
# in as DATABASE_URL when Render prompts for it. See DEPLOY.md.
services:
  - type: web
    name: bigpush-accountability-api
    env: node
    plan: free
    # `prisma db push`, not `prisma migrate deploy`: this repo has
    # prisma/schema.prisma but no prisma/migrations directory (it was
    # never possible to generate one from the sandbox this project was
    # built in — Prisma's engine-binary download is blocked there), so
    # there's no migration history for `migrate deploy` to apply. `db
    # push` syncs the database straight from schema.prisma instead. If
    # this project grows real users, switch to `prisma migrate dev`
    # from a machine that can reach binaries.prisma.sh, commit the
    # generated prisma/migrations folder, and change this back to
    # `prisma migrate deploy` for safer, reviewable schema changes.
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
